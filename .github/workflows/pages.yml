name: Deploy RICO report to Pages
on:
  push:
    branches: [claude/pump-fun-launch-patterns-qyv6vp]
    paths: ['pump-rico/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pump-rico
      - id: deployment
        uses: actions/deploy-pages@v4
